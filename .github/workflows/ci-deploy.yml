name: Aluminate Global Backend CI (PR Check)

on:
  pull_request:
    branches: [ production ]

permissions:
  contents: read

concurrency:
  group: global-backend-ci
  cancel-in-progress: true


jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build project (no tests)
        working-directory: aluminate-global-backend
        run: mvn clean package -DskipTests --no-transfer-progress
