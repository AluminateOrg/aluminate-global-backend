name: Production CI

on:
  pull_request:
    branches: [ production ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-ci
  cancel-in-progress: true


jobs:
  build:
    name: Build (No Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Structure
        run: ls -R

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Project
        working-directory: aluminate-global-backend/aluminate-global-backend
        run: mvn -B clean package -DskipTests --no-transfer-progress

      - name: Comment PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI passed: build successful.'
            })
