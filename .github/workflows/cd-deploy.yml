name: Production CD

on:
  push:
    branches: [ production ]

permissions:
  contents: read

concurrency:
  group: production-cd
  cancel-in-progress: true


jobs:
  deploy:
    name: Build & Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # Setup Java
      # ----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ----------------------------
      # Build JAR (NO TESTS)
      # ----------------------------
      - name: Build Application
        working-directory: aluminate-global-backend/aluminate-global-backend
        run: mvn -B clean package -DskipTests --no-transfer-progress

      # ----------------------------
      # Build Docker Image (LOCAL ONLY)
      # ----------------------------
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t aluminate/global-backend:${{ github.sha }} \
            -t aluminate/global-backend:latest .

      # ----------------------------
      # Save as TAR
      # ----------------------------
      - name: Save Docker Image
        run: docker save aluminate/global-backend:latest | gzip > backend.tar.gz

      # ----------------------------
      # Copy TAR to server
      # ----------------------------
      - name: Copy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend.tar.gz
          target: /opt/aluminate/global-backend/

      # ----------------------------
      # Deploy on server
      # ----------------------------
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /opt/aluminate/global-backend

            echo "📦 Loading image..."
            docker load < backend.tar.gz

            echo "🧹 Cleaning archive..."
            rm -f backend.tar.gz

            echo "🚀 Restarting container..."
            docker compose -f /opt/aluminate/config/docker-compose.yml up -d --force-recreate --no-deps global-backend

            echo "🧼 Cleaning unused images..."
            docker image prune -f

            echo "⏳ Waiting for startup..."
            sleep 10

            echo "📊 Container status:"
            docker ps | grep global-backend || true

            echo "📜 Logs:"
            docker logs global-backend --tail=50 || true

            echo "✅ Production deployment complete"
