name: Global Backend CD

on:
  push:
    branches: [ production ]

permissions:
  contents: read

concurrency:
  group: production-global-backend-cd
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aluminate-global-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Application
        run: mvn -B clean package -DskipTests --no-transfer-progress

      - name: Build Docker Image
        run: |
          docker build --pull \
            --build-arg GLOBAL_PORT=${{ secrets.GLOBAL_PORT }} \
            -t aluminate/global-backend:${{ github.sha }} \
            -t aluminate/global-backend:latest \
            .

      - name: Save Docker Image
        run: docker save aluminate/global-backend:latest | gzip > global-backend.tar.gz

      - name: Copy Image to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: aluminate-global-backend/global-backend.tar.gz
          target: /opt/aluminate/app/aluminate-global-backend/
          strip_components: 1
          rm: false

      - name: Load & Restart on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "Loading new Docker image..."
            cd /opt/aluminate/app/aluminate-global-backend
            docker load < global-backend.tar.gz
            rm -f global-backend.tar.gz

            echo "Recreating global-backend container..."
            docker compose \
              -f /opt/aluminate/config/docker-compose.yml \
              --env-file /opt/aluminate/config/global.env \
              up -d --force-recreate --no-deps global-backend

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Waiting for startup..."
            sleep 15

            echo "Container status:"
            docker ps | grep global-backend

            echo "Recent logs:"
            docker logs aluminate-global-backend-global-backend-1 --tail=50

            echo "Deployment complete"

      - name: Deployment Success
        run: echo "Global Backend deployed to Production"