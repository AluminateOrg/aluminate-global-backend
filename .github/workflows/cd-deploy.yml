name: Aluminate Global Backend CI/CD (UAT)

on:
  pull_request:
    branches: [ uat ]
    types: [opened, synchronize, reopened]

  push:
    branches: [ uat ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: aluminate-uat-backend
  cancel-in-progress: true


jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn -B clean verify --no-transfer-progress

      - name: Comment PR Success
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All tests passed. Ready for UAT deployment.'
            })


  deploy:
    name: Build & Deploy to UAT
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Build Java App
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Application (Skip Tests)
        run: mvn -B clean package -DskipTests --no-transfer-progress

      # -----------------------------
      # Build Docker Image (LOCAL ONLY)
      # -----------------------------
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t aluminate/global-backend:${{ github.sha }} \
            -t aluminate/global-backend:latest .

      # -----------------------------
      # Save image as TAR
      # -----------------------------
      - name: Save Docker Image
        run: |
          docker save aluminate/global-backend:latest | gzip > backend.tar.gz

      # -----------------------------
      # Copy TAR to server
      # -----------------------------
      - name: Copy Image to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend.tar.gz
          target: /opt/aluminate/global-backend/

      # -----------------------------
      # Load + Restart on server
      # -----------------------------
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /opt/aluminate/global-backend

            echo "📦 Loading Docker image..."
            docker load < backend.tar.gz

            echo "🧹 Removing archive..."
            rm -f backend.tar.gz

            echo "🚀 Restarting container..."
            docker compose -f /opt/aluminate/config/docker-compose.yml up -d --force-recreate --no-deps global-backend

            echo "🧼 Cleaning unused images..."
            docker image prune -f

            echo "⏳ Waiting for startup..."
            sleep 10

            echo "📊 Container status:"
            docker ps | grep global-backend || true

            echo "📜 Recent logs:"
            docker logs global-backend --tail=50 || true

            echo "✅ Deployment complete"


  notify:
    name: Success Notification
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Success message
        run: echo "🚀 Aluminate Global Backend deployed successfully"
