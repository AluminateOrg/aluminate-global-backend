<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #4a90e2;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 30px;
            text-align: center;
            color: #333333;
        }
        .otp-box {
            background-color: #f0f7ff;
            border: 2px dashed #4a90e2;
            display: inline-block;
            padding: 15px 25px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 28px;
            font-weight: bold;
            color: #4a90e2;
            letter-spacing: 4px;
        }
        .footer {
            background-color: #f4f4f7;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888888;
        }
        .footer a {
            color: #4a90e2;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Verify Your Email</h1>
    </div>
    <div class="content">
        <p>Dear User,</p>
        <p>Use the following One-Time Password (OTP) to verify your email address. This code will expire in 5 minutes.</p>
        <div class="otp-box">{{OTP}}</div>
        <p>If you didn’t request this, please ignore this email.</p>
        <p>Thank you,<br><strong>Aluminate Team</strong></p>
    </div>
    <div class="footer">
        <p>© 2025 Aluminate Inc. All rights reserved.</p>
        <p><a href="https://yourdomain.com">Visit our website</a></p>
    </div>
</div>
</body>
</html>
