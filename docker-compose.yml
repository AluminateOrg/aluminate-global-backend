services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aluminate-network

  backend:
    build:
      context: ./aluminate-global-backend
      dockerfile: Dockerfile  # Using development Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      WEBSITE_FRONTEND_URL: http://localhost:3000
      ADMIN_FRONTEND_URL: http://localhost:3001
    ports:
      - "8080:8080"  # Application port
      - "5005:5005"  # Debug port
    volumes:
      - ./aluminate-global-backend:/app
      - ~/.m2:/root/.m2  # Cache Maven dependencies
    depends_on:
      - postgres
    networks:
      - aluminate-network

  website-frontend:
    build:
      context: ./aluminate-website-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./aluminate-website-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aluminate-network

  admin-frontend:
    build:
      context: ./aluminate-admin-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./aluminate-admin-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aluminate-network

volumes:
  postgres_data:

networks:
  aluminate-network:
    external: true
    name: aluminate-global-network
